
server:
  port: ${SERVER_PORT:8080}
  max-http-request-header-size: 16KB

spring:
  application:
    name: scamshield-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:scamshield}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:scamshield}
    password: ${MYSQL_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 8

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  servlet:
    multipart:
      max-request-size: 256KB
      max-file-size: 256KB

scamshield:
  ml:
    base-url: ${ML_SERVICE_URL:http://localhost:8001}
    connect-timeout: 2s
    read-timeout: 10s
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
